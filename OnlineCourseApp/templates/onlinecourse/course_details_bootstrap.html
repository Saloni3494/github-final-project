<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Course Details</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
</head>
<body>
    <div class="container mt-5">
        <h1 class="mb-4">{{ course.name }}</h1>
        <p class="lead">{{ course.description }}</p>
        
        <h2 class="mt-4">Lessons:</h2>
        <div class="list-group">
            {% for lesson in course.lesson_set.all %}
                <a href="#" class="list-group-item list-group-item-action flex-column align-items-start">
                    <div class="d-flex w-100 justify-content-between">
                        <h5 class="mb-1">{{ lesson.title }}</h5>
                        <small>Order: {{ lesson.order }}</small>
                    </div>
                    <p class="mb-1">{{ lesson.content }}</p>
                </a>
            {% empty %}
                <p>No lessons available for this course yet.</p>
            {% endfor %}
        </div>
        
        <!-- Button to start exam -->
        <a href="{% url 'onlinecourse:exam' course.id %}" class="btn btn-primary mt-4">Take Final Exam</a>
    </div>
</body>
</html>
